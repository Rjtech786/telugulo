# Nginx reverse proxy for telugulo.in → Next.js (PM2 on port 3000).
# Behind Cloudflare. Copy to /etc/nginx/sites-available/telugulo and symlink
# into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this is live for Let's Encrypt (Cloudflare SSL = Full Strict).

server {
    listen 80;
    server_name telugulo.in www.telugulo.in;

    # Let Cloudflare/Certbot handle ACME; redirect everything else to https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name telugulo.in www.telugulo.in;

    # Certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/telugulo.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/telugulo.in/privkey.pem;

    # Use the real client IP from Cloudflare.
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets — long cache.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
